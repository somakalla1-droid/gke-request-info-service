name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod, cache: false}
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - uses: azure/setup-helm@v4
      - run: helm lint charts/gke-request-info-service
      - run: docker build -t gke-request-info-service:${{ github.sha }} .
