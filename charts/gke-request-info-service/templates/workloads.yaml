apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccount" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.configMap" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
data:
  APP_VERSION: {{ .Values.image.tag | quote }}
  CLUSTER_NAME: {{ .Values.config.clusterName | quote }}
  REGION: {{ .Values.config.region | quote }}
  RESPONSE_SERVICE_URL: {{ .Values.config.responseServiceURL | quote }}
  OBSERVABILITY_ENABLED: {{ .Values.observability.enabled | quote }}
  GOOGLE_CLOUD_PROJECT: {{ .Values.observability.projectId | quote }}
---
{{- if .Values.secret.create }}
{{- if not .Values.secret.stringData }}
{{- fail "secret.stringData must contain at least one value when secret.create is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.secret" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secret.stringData }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
  {{- if .Values.ingress.enabled }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: {{ include "app.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
---
{{- if .Values.serviceExport.enabled }}
apiVersion: net.gke.io/v1
kind: ServiceExport
metadata:
  name: {{ include "app.fullname" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
---
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
  # GKE's built-in controller requires this annotation; it does not process
  # spec.ingressClassName even though Kubernetes marks the annotation legacy.
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  defaultBackend:
    service:
      name: {{ include "app.fullname" . }}
      port:
        number: {{ .Values.service.port }}
{{- if .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "app.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.serviceAccount" . }}
      {{- if .Values.observability.enabled }}
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      {{- end }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: application
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: {drop: ["ALL"]}
          envFrom:
            - configMapRef:
                name: {{ include "app.configMap" . }}
            {{- if or .Values.secret.create .Values.secret.existingSecret }}
            - secretRef:
                name: {{ include "app.secret" . }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ include "app.fullname" . }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "app.fullname" . }}}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ include "app.fullname" . }}}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "app.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
