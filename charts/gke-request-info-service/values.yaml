replicaCount: 2
image:
  repository: us-central1-docker.pkg.dev/gke-sre-assesment/gke-apps/gke-request-info-service
  tag: latest
  pullPolicy: IfNotPresent
serviceAccount: {create: true, name: ""}
service: {type: ClusterIP, port: 80}
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 128Mi}
autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70}
podDisruptionBudget: {minAvailable: 1}
config:
  clusterName: unknown
  region: unknown
  responseServiceURL: ""
secret:
  create: false
  existingSecret: ""
  stringData: {}
