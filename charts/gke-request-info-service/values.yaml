replicaCount: 2
image:
  repository: us-central1-docker.pkg.dev/gke-sre-assesment/gke-apps/gke-request-info-service
  tag: latest
  pullPolicy: IfNotPresent
serviceAccount: {create: true, name: ""}
service: {type: ClusterIP, port: 80}
serviceExport:
  # Export only Application A for Multi-Cluster Services. The response service
  # remains cluster-local so each request instance calls its local dependency.
  enabled: false
ingress:
  # Disabled by default: enabling it provisions a billable external GKE load balancer.
  enabled: false
  # Leave empty to route the load balancer IP's default host. Set a domain only
  # after its DNS record and TLS certificate strategy are in place.
  host: ""
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 128Mi}
autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 5, targetCPUUtilizationPercentage: 70}
podDisruptionBudget: {minAvailable: 1}
config:
  clusterName: unknown
  region: unknown
  responseServiceURL: ""
secret:
  create: false
  existingSecret: ""
  stringData: {}
